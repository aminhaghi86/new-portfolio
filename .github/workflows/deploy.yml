name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          # استفاده از کلید جدید
          key: ${{ secrets.SSH_PRIVATE_KEY_USA_VPS }}
          # تنظیمات برای جلوگیری از خطای Timeout
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /var/www/portfolio-new
            
            # بروزرسانی کدها
            git fetch origin main
            git reset --hard origin/main
            
            # ساخت ایمیج با متغیرهای لازم
            docker build \
              --build-arg VITE_N8N_WEBHOOK_URL=${{ secrets.VITE_N8N_WEBHOOK_URL }} \
              --build-arg VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }} \
              -t portfolio-app .
            
            # حذف کانتینر قدیمی با نام درست
            docker stop portfolio-container || true
            docker rm portfolio-container || true
            
            # اجرای کانتینر جدید
            docker run -d --name portfolio-container -p 3000:80 portfolio-app